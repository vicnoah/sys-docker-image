name: Publish TencentOS Docker image

on:
  workflow_dispatch:
    inputs:
      ver:
        description: 'TencentOS version'
        required: true
        type: choice
        options:
          - all
          - 3.1
          - 3.3
          - 4.0
          - 4.2
          - 4.4
          - 4.6
      push:
        description: 'Push to Docker Hub'
        type: boolean

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${{ inputs.ver }}" == "all" ]]; then
            echo 'matrix=[{"ver":"3.1","file":"tencentos_3_1.sys.Dockerfile"},{"ver":"3.3","file":"tencentos_3_3.sys.Dockerfile"},{"ver":"4.0","file":"tencentos_4_0.sys.Dockerfile"},{"ver":"4.2","file":"tencentos_4_2.sys.Dockerfile"},{"ver":"4.4","file":"tencentos_4_4.sys.Dockerfile"},{"ver":"4.6","file":"tencentos_4_6.sys.Dockerfile"}]' >> $GITHUB_OUTPUT
          else
            file_name="tencentos_$(echo ${{ inputs.ver }} | tr . _).sys.Dockerfile"
            echo "matrix=[{\"ver\":\"${{inputs.ver}}\",\"file\":\"${file_name}\"}]" >> $GITHUB_OUTPUT
          fi
  build:
    needs: [setup]
    strategy:
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    name: Build and push
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          platforms: ${{ matrix.ver == '3.1' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          context: .
          file: ./${{ matrix.file }}
          push: ${{ inputs.push }}
          tags: ${{ vars.DOCKER_USERNAME }}/tencentos:${{ matrix.ver }}
