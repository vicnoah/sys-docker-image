name: Publish Kylin Docker image

on:
  workflow_dispatch:
    inputs:
      sp_ver:
        description: 'Kylin version'
        required: true
        type: choice
        options:
          - all
          - sp1
          - sp2
          - sp3
          - sp3-2403
          - sp3.1
          - 10.0
          - 10.1
          - v11-2503
          - v7-sp1
          - v6-6.9
      push:
        description: 'Push to Docker Hub'
        type: boolean

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${{ inputs.sp_ver }}" == "all" ]]; then
            echo 'matrix=[{"ver":"sp1","file":"kylin_v10_sp1.sys.Dockerfile"},{"ver":"sp2","file":"kylin_v10_sp2.sys.Dockerfile"},{"ver":"sp3","file":"kylin_v10_sp3.sys.Dockerfile"},{"ver":"sp3-2403","file":"kylin_v10_sp3_2403.sys.Dockerfile"},{"ver":"sp3.1","file":"kylin_v10_sp3_1.sys.Dockerfile"},{"ver":"10.0","file":"kylin_v10_10_0.sys.Dockerfile"},{"ver":"10.1","file":"kylin_v10_10_1.sys.Dockerfile"},{"ver":"v11-2503","file":"kylin_v11_2503.sys.Dockerfile"},{"ver":"v7-sp1","file":"kylin_v7_sp1.sys.Dockerfile"},{"ver":"v6-6.9","file":"kylin_v6_6_9.sys.Dockerfile"}]' >> $GITHUB_OUTPUT
          else
            case "${{ inputs.sp_ver }}" in
              sp1) file="kylin_v10_sp1.sys.Dockerfile" ;;
              sp2) file="kylin_v10_sp2.sys.Dockerfile" ;;
              sp3) file="kylin_v10_sp3.sys.Dockerfile" ;;
              sp3-2403) file="kylin_v10_sp3_2403.sys.Dockerfile" ;;
              sp3.1) file="kylin_v10_sp3_1.sys.Dockerfile" ;;
              10.0) file="kylin_v10_10_0.sys.Dockerfile" ;;
              10.1) file="kylin_v10_10_1.sys.Dockerfile" ;;
              v11-2503) file="kylin_v11_2503.sys.Dockerfile" ;;
              v7-sp1) file="kylin_v7_sp1.sys.Dockerfile" ;;
              v6-6.9) file="kylin_v6_6_9.sys.Dockerfile" ;;
            esac
            echo "matrix=[{\"ver\":\"${{inputs.sp_ver}}\",\"file\":\"${file}\"}]" >> $GITHUB_OUTPUT
          fi
  build:
    needs: [setup]
    strategy:
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    name: Build and push
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          platforms: ${{ (matrix.ver == 'v6-6.9') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          context: .
          file: ./${{ matrix.file }}
          push: ${{ inputs.push }}
          tags: ${{ vars.DOCKER_USERNAME }}/kylin:${{ matrix.ver }}
